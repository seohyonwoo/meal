<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공주대학교 기숙사 식단표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-200">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg dark:bg-indigo-900">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> 공주대 기숙사 식단표
        </h1>
        <p class="text-xs text-indigo-200">공주대학교 생활관(dormi.kongju.ac.kr) 연동</p>
      </div>
      <button id="themeToggle" class="p-2 rounded-lg bg-indigo-500 hover:bg-indigo-400 dark:bg-indigo-800 text-white transition">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- 날짜 이동 네비게이션 -->
    <section class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 mb-4">
      <div class="flex items-center justify-between gap-2 mb-3">
        <button id="prevBtn" class="flex-1 py-2 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-chevron-left text-[10px]"></i> 어제
        </button>
        <button id="todayBtn" class="px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-1">
          <i class="fa-solid fa-calendar-day"></i> 오늘
        </button>
        <button id="nextBtn" class="flex-1 py-2 px-3 bg-slate-100 dark:bg-slate-700 hover:bg-indigo-50 dark:hover:bg-slate-600 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1">
          내일 <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>

      <!-- 요일 직접 선택 탭 -->
      <div id="dayTabs" class="grid grid-cols-7 gap-1 text-center text-xs font-semibold"></div>
    </section>

    <!-- 연결 상태 안내 -->
    <div class="flex items-center justify-between text-xs text-slate-500 mb-4 px-1">
      <div class="flex items-center gap-1.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse" id="statusDot"></span>
        <span id="statusText">데이터 연결 중...</span>
      </div>
      <button id="retryBtn" class="text-xs text-indigo-600 dark:text-indigo-400 underline font-medium">재시도</button>
    </div>

    <!-- 끼니 카드 (아침, 점심, 저녁) -->
    <section class="space-y-4" id="mealContainer">
      <!-- 아침 -->
      <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100 dark:border-slate-700">
          <span class="font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-sun"></i> 아침 (조식)
          </span>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" id="tagBreakfast">대기</span>
        </div>
        <div id="menuBreakfast" class="text-sm space-y-1 text-slate-700 dark:text-slate-300 leading-relaxed">
          <p class="animate-pulse text-slate-400">불러오는 중...</p>
        </div>
      </div>

      <!-- 점심 -->
      <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100 dark:border-slate-700">
          <span class="font-bold text-amber-600 dark:text-amber-400 flex items-center gap-2">
            <i class="fa-solid fa-cloud-sun"></i> 점심 (중식)
          </span>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" id="tagLunch">대기</span>
        </div>
        <div id="menuLunch" class="text-sm space-y-1 text-slate-700 dark:text-slate-300 leading-relaxed">
          <p class="animate-pulse text-slate-400">불러오는 중...</p>
        </div>
      </div>

      <!-- 저녁 -->
      <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100 dark:border-slate-700">
          <span class="font-bold text-purple-600 dark:text-purple-400 flex items-center gap-2">
            <i class="fa-solid fa-moon"></i> 저녁 (석식)
          </span>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium" id="tagDinner">대기</span>
        </div>
        <div id="menuDinner" class="text-sm space-y-1 text-slate-700 dark:text-slate-300 leading-relaxed">
          <p class="animate-pulse text-slate-400">불러오는 중...</p>
        </div>
      </div>
    </section>

    <!-- 원본 페이지 링크 -->
    <div class="mt-6 text-center">
      <a href="https://dormi.kongju.ac.kr/HOME/sub.php?code=041304" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-indigo-500 underline">
        공주대학교 생활관 원본 식단표 열기 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
      </a>
    </div>
  </main>

  <script>
    const TARGET_URL = 'https://dormi.kongju.ac.kr/HOME/sub.php?code=041304';
    const daysName = ['월', '화', '수', '목', '금', '토', '일'];

    function getTodayIndex() {
      let day = new Date().getDay() - 1; 
      return day < 0 ? 6 : day;
    }

    const REAL_TODAY_IDX = getTodayIndex();
    let selectedDayIdx = REAL_TODAY_IDX;

    let parsedWeeklyData = {
      breakfast: Array(7).fill('등록된 식단이 없습니다.'),
      lunch: Array(7).fill('등록된 식단이 없습니다.'),
      dinner: Array(7).fill('등록된 식단이 없습니다.')
    };

    function renderTabs() {
      const dayTabs = document.getElementById('dayTabs');
      dayTabs.innerHTML = '';

      daysName.forEach((day, idx) => {
        const isSelected = idx === selectedDayIdx;
        const isToday = idx === REAL_TODAY_IDX;

        const btn = document.createElement('button');
        btn.className = `py-2 rounded-lg transition flex flex-col items-center justify-center relative ${
          isSelected 
            ? 'bg-indigo-600 text-white shadow-md' 
            : 'bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 text-slate-600 dark:text-slate-300'
        }`;

        btn.innerHTML = `
          <span class="text-[10px] ${isSelected ? 'opacity-90' : 'opacity-60'}">${day}</span>
          <span class="font-bold text-xs">${day}요일</span>
          ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 absolute top-1 right-1"></span>' : ''}
        `;

        btn.onclick = () => {
          selectedDayIdx = idx;
          renderTabs();
          displaySelectedDayMenu();
        };
        dayTabs.appendChild(btn);
      });
    }

    function updateMealTags() {
      const hour = new Date().getHours();
      const tagB = document.getElementById('tagBreakfast');
      const tagL = document.getElementById('tagLunch');
      const tagD = document.getElementById('tagDinner');

      [tagB, tagL, tagD].forEach(t => { 
        t.innerText = "대기"; 
        t.className = "text-xs bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400 px-2 py-0.5 rounded-full font-medium"; 
      });

      if (selectedDayIdx === REAL_TODAY_IDX) {
        if (hour < 9) {
          tagB.innerText = "지금 식사 시간";
          tagB.className = "text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200 px-2 py-0.5 rounded-full font-bold animate-pulse";
        } else if (hour >= 9 && hour < 14) {
          tagL.innerText = "지금 식사 시간";
          tagL.className = "text-xs bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-200 px-2 py-0.5 rounded-full font-bold animate-pulse";
        } else if (hour >= 14 && hour < 20) {
          tagD.innerText = "지금 식사 시간";
          tagD.className = "text-xs bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-200 px-2 py-0.5 rounded-full font-bold animate-pulse";
        }
      }
    }

    function displaySelectedDayMenu() {
      updateMealTags();

      const formatText = (text) => {
        if (!text || text.trim() === '' || text.includes('없습니다')) {
          return '<p class="text-slate-400 italic">등록된 식단이 없습니다.</p>';
        }
        return text.split(/<br\s*\/?>|\n/gi)
                   .map(item => item.replace(/<[^>]*>?/gm, '').trim())
                   .filter(item => item !== '')
                   .map(item => `<div class="py-0.5">• ${item}</div>`)
                   .join('');
      };

      document.getElementById('menuBreakfast').innerHTML = formatText(parsedWeeklyData.breakfast[selectedDayIdx]);
      document.getElementById('menuLunch').innerHTML = formatText(parsedWeeklyData.lunch[selectedDayIdx]);
      document.getElementById('menuDinner').innerHTML = formatText(parsedWeeklyData.dinner[selectedDayIdx]);
    }

    // 타임아웃 지원 fetch
    async function fetchWithTimeout(url, options = {}, timeout = 6000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    // 다중 프록시를 순차 시도하는 자동 Fallback 크롤러
    async function fetchDormiMeal() {
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');

      statusText.innerText = '학교 서버 식단 읽어오는 중...';
      statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping';

      // 순차적으로 시도할 프록시 목록
      const proxyList = [
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        url => `https://thingproxy.freeboard.io/fetch/${url}`
      ];

      let rawHtml = null;

      for (const getProxyUrl of proxyList) {
        try {
          const targetProxy = getProxyUrl(TARGET_URL);
          const res = await fetchWithTimeout(targetProxy, {}, 5000);
          
          if (!res.ok) continue;

          if (targetProxy.includes('allorigins')) {
            const json = await res.json();
            rawHtml = json.contents;
          } else {
            rawHtml = await res.text();
          }

          if (rawHtml && rawHtml.length > 500) {
            break; // 성공적인 HTML 응답 획득시 반복 중단
          }
        } catch (e) {
          console.warn('프록시 시도 실패, 다음 서비스 시도 중...', e);
        }
      }

      // 파싱 시도
      if (rawHtml) {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(rawHtml, 'text/html');
          const tables = doc.querySelectorAll('table');

          let found = false;
          tables.forEach(table => {
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
              const rowText = row.innerText || '';
              const cells = Array.from(row.querySelectorAll('td, th')).map(td => td.innerHTML);

              if (rowText.includes('아침') || rowText.includes('조식')) {
                cells.slice(1, 8).forEach((html, i) => { if(i < 7 && html) parsedWeeklyData.breakfast[i] = html; });
                found = true;
              } else if (rowText.includes('점심') || rowText.includes('중식')) {
                cells.slice(1, 8).forEach((html, i) => { if(i < 7 && html) parsedWeeklyData.lunch[i] = html; });
                found = true;
              } else if (rowText.includes('저녁') || rowText.includes('석식')) {
                cells.slice(1, 8).forEach((html, i) => { if(i < 7 && html) parsedWeeklyData.dinner[i] = html; });
                found = true;
              }
            });
          });

          if (found) {
            statusText.innerText = '실시간 연동 완료';
            statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-500';
            displaySelectedDayMenu();
            return;
          }
        } catch (parseErr) {
          console.error('파싱 에러:', parseErr);
        }
      }

      // 프록시 전체 실패 또는 파싱 불가 시 오프라인 안전 모드 작동
      statusText.innerText = '학교 연결 지연 (샘플 식단 표시)';
      statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-amber-500';

      parsedWeeklyData = {
        breakfast: Array(7).fill('쌀밥<br>콩나물국<br>제육볶음<br>배추김치'),
        lunch: Array(7).fill('돈까스<br>우동<br>단무지<br>깍두기'),
        dinner: Array(7).fill('잡곡밥<br>순두부찌개<br>계란말이<br>열무김치')
      };

      displaySelectedDayMenu();
    }

    // 네비게이션 이벤트
    document.getElementById('prevBtn').onclick = () => {
      selectedDayIdx = (selectedDayIdx - 1 + 7) % 7;
      renderTabs();
      displaySelectedDayMenu();
    };

    document.getElementById('nextBtn').onclick = () => {
      selectedDayIdx = (selectedDayIdx + 1) % 7;
      renderTabs();
      displaySelectedDayMenu();
    };

    document.getElementById('todayBtn').onclick = () => {
      selectedDayIdx = REAL_TODAY_IDX;
      renderTabs();
      displaySelectedDayMenu();
    };

    document.getElementById('retryBtn').onclick = fetchDormiMeal;
    document.getElementById('themeToggle').onclick = () => document.documentElement.classList.toggle('dark');

    // 실행
    renderTabs();
    fetchDormiMeal();
  </script>
</body>
</html>
