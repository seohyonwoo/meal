<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공주대학교 천안캠퍼스 기숙사 식단표</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    button {
      transition: background-color 0.15s, transform 0.15s;
    }

    button:active {
      transform: scale(0.97);
    }

    .meal-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      min-height: 150px;
    }

    .meal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .meal-content {
      color: #475569;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .day-button.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .day-button {
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 10px;
      padding: 10px 0;
      font-weight: 600;
    }

    .week-button {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 9px 12px;
      background: white;
      font-size: 14px;
      font-weight: 600;
    }

    .week-button:hover,
    .day-button:hover {
      background-color: #eff6ff;
    }

    .day-button.active:hover {
      background: #1d4ed8;
    }

    .status-message {
      min-height: 24px;
      font-size: 13px;
      color: #64748b;
    }

    .loading {
      opacity: 0.65;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="max-w-4xl mx-auto px-4 py-8">

    <header class="mb-7">
      <p class="text-sm font-semibold text-blue-600 mb-2">
        KONGJU NATIONAL UNIVERSITY
      </p>

      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
        기숙사 식단표
      </h1>

      <p class="text-sm text-slate-500 mt-2">
        천안캠퍼스 · 평일 식단 안내
      </p>
    </header>

    <!-- 주간 이동 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4 mb-4">
      <div class="flex items-center justify-between gap-2">
        <button
          id="prevWeekBtn"
          class="week-button"
          type="button"
        >
          ← 이전 주
        </button>

        <div class="text-center min-w-0">
          <div id="weekLabel" class="font-bold text-sm sm:text-base">
            주간 식단
          </div>
          <div id="weekRange" class="text-xs text-slate-500 mt-1">
            날짜 확인 중
          </div>
        </div>

        <button
          id="nextWeekBtn"
          class="week-button"
          type="button"
        >
          다음 주 →
        </button>
      </div>

      <button
        id="currentWeekBtn"
        class="w-full mt-3 rounded-lg bg-slate-100 hover:bg-slate-200 py-2 text-sm font-semibold"
        type="button"
      >
        이번 주로 돌아가기
      </button>
    </section>

    <!-- 날짜 이동 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4 mb-4">
      <div class="flex items-center justify-between gap-2 mb-4">
        <button
          id="prevBtn"
          class="week-button"
          type="button"
        >
          ← 이전 날
        </button>

        <div class="text-center">
          <div id="selectedDateLabel" class="font-bold text-lg">
            날짜 확인 중
          </div>
          <div id="selectedDayLabel" class="text-sm text-slate-500 mt-1">
          </div>
        </div>

        <button
          id="nextBtn"
          class="week-button"
          type="button"
        >
          다음 날 →
        </button>
      </div>

      <div class="grid grid-cols-5 gap-2">
        <button class="day-button" data-day="0" type="button">월</button>
        <button class="day-button" data-day="1" type="button">화</button>
        <button class="day-button" data-day="2" type="button">수</button>
        <button class="day-button" data-day="3" type="button">목</button>
        <button class="day-button" data-day="4" type="button">금</button>
      </div>
    </section>

    <!-- 새로고침 -->
    <section class="flex items-center justify-between gap-3 mb-4">
      <div id="statusMessage" class="status-message">
        식단을 불러올 준비가 되었습니다.
      </div>

      <button
        id="refreshBtn"
        class="shrink-0 rounded-lg bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-sm font-semibold"
        type="button"
      >
        식단 새로고침
      </button>
    </section>

    <!-- 식단 표시 -->
    <section id="mealContainer" class="grid gap-4 sm:grid-cols-3">
      <article class="meal-card">
        <h2 class="meal-title">아침</h2>
        <div id="breakfast" class="meal-content">불러오는 중...</div>
      </article>

      <article class="meal-card">
        <h2 class="meal-title">점심</h2>
        <div id="lunch" class="meal-content">불러오는 중...</div>
      </article>

      <article class="meal-card">
        <h2 class="meal-title">저녁</h2>
        <div id="dinner" class="meal-content">불러오는 중...</div>
      </article>
    </section>

    <footer class="mt-8 text-xs text-slate-400 leading-relaxed">
      <p>식단 정보는 공주대학교 기숙사 홈페이지를 기준으로 표시합니다.</p>
      <p class="mt-1">실제 제공 메뉴 및 운영 여부는 학교 공지사항을 확인해 주세요.</p>
    </footer>

  </main>

  <script>
    // ============================================
    // 설정
    // ============================================

    const WORKER_URL =
      "https://meal.curly-base-322e.workers.dev/";

    const CACHE_PREFIX = "kongju_dorm_meals_v2_";

    const DAY_NAMES = [
      "월요일",
      "화요일",
      "수요일",
      "목요일",
      "금요일"
    ];

    const MONTH_DAY_FORMATTER = new Intl.DateTimeFormat(
      "ko-KR",
      {
        month: "numeric",
        day: "numeric"
      }
    );

    // 현재 보고 있는 주의 월요일
    let currentWeekMonday = getMonday(new Date());

    // 현재 선택된 평일 인덱스: 월요일 0 ~ 금요일 4
    let selectedDayIndex = getWeekdayIndex(new Date());

    // 주간 식단 데이터
    let mealsByDate = {};

    // 중복 요청 방지
    let isLoading = false;


    // ============================================
    // 날짜 관련 함수
    // ============================================

    function dateOnly(date) {
      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );
    }

    function addDays(date, amount) {
      const result = new Date(date);
      result.setDate(result.getDate() + amount);
      return result;
    }

    function getMonday(date) {
      const result = dateOnly(date);
      const day = result.getDay();

      // 일요일이면 6일 전, 그 외에는 월요일까지 이동
      const diff = day === 0 ? -6 : 1 - day;

      result.setDate(result.getDate() + diff);

      return result;
    }

    function getWeekdayIndex(date) {
      const day = date.getDay();

      if (day === 0) return 0;
      if (day === 6) return 4;

      return day - 1;
    }

    function getSelectedDate() {
      return addDays(currentWeekMonday, selectedDayIndex);
    }

    function formatDate(date) {
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function formatFullDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatApiDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}${month}${day}`;
    }

    function getWeekCacheKey() {
      return CACHE_PREFIX + formatFullDate(currentWeekMonday);
    }

    function getWeekEnd() {
      return addDays(currentWeekMonday, 4);
    }

    function isSameDate(a, b) {
      return formatFullDate(a) === formatFullDate(b);
    }


    // ============================================
    // 화면 표시 함수
    // ============================================

    function updateDateControls() {
      const weekEnd = getWeekEnd();
      const selectedDate = getSelectedDate();

      document.getElementById("weekLabel").textContent =
        `${currentWeekMonday.getFullYear()}년 주간 식단`;

      document.getElementById("weekRange").textContent =
        `${formatDate(currentWeekMonday)} ~ ${formatDate(weekEnd)}`;

      document.getElementById("selectedDateLabel").textContent =
        formatDate(selectedDate);

      document.getElementById("selectedDayLabel").textContent =
        DAY_NAMES[selectedDayIndex];

      document.querySelectorAll(".day-button").forEach((button) => {
        const index = Number(button.dataset.day);

        button.classList.toggle(
          "active",
          index === selectedDayIndex
        );
      });

      const todayMonday = getMonday(new Date());

      document.getElementById("currentWeekBtn").disabled =
        isSameDate(currentWeekMonday, todayMonday);

      document.getElementById("currentWeekBtn").classList.toggle(
        "opacity-50",
        isSameDate(currentWeekMonday, todayMonday)
      );
    }

    function setStatus(message) {
      document.getElementById("statusMessage").textContent = message;
    }

    function showMealText(elementId, text) {
      const element = document.getElementById(elementId);

      // 메뉴를 HTML로 삽입하지 않아 외부 HTML 실행을 방지
      element.textContent = text || "등록된 식단 정보가 없습니다.";
    }

    function renderSelectedDay() {
      updateDateControls();

      const dateKey = formatFullDate(getSelectedDate());
      const meal = mealsByDate[dateKey];

      if (!meal) {
        showMealText("breakfast", "식단 정보가 없습니다.");
        showMealText("lunch", "식단 정보가 없습니다.");
        showMealText("dinner", "식단 정보가 없습니다.");
        return;
      }

      showMealText("breakfast", meal.breakfast);
      showMealText("lunch", meal.lunch);
      showMealText("dinner", meal.dinner);
    }


    // ============================================
    // 캐시 관련 함수
    // ============================================

    function loadMealsFromCache() {
      try {
        const raw = localStorage.getItem(getWeekCacheKey());

        if (!raw) {
          return false;
        }

        const cached = JSON.parse(raw);

        if (
          !cached ||
          typeof cached.data !== "object" ||
          !cached.data
        ) {
          return false;
        }

        mealsByDate = cached.data;

        renderSelectedDay();

        const savedAt = cached.savedAt
          ? new Date(cached.savedAt)
          : null;

        if (savedAt && !Number.isNaN(savedAt.getTime())) {
          setStatus(
            `저장된 식단 표시 중 · ${savedAt.toLocaleString("ko-KR")} 저장`
          );
        } else {
          setStatus("저장된 식단 표시 중");
        }

        return true;
      } catch (error) {
        console.warn("캐시 읽기 실패:", error);
        return false;
      }
    }

    function saveMealsToCache() {
      try {
        const payload = {
          savedAt: new Date().toISOString(),
          data: mealsByDate
        };

        localStorage.setItem(
          getWeekCacheKey(),
          JSON.stringify(payload)
        );
      } catch (error) {
        console.warn("캐시 저장 실패:", error);
      }
    }


    // ============================================
    // 학교 식단 페이지 파싱
    // ============================================

    function cleanText(value) {
      return String(value || "")
        .replace(/\u00a0/g, " ")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function findMealCell(row, name, fallbackIndex) {
      const selectors = {
        breakfast: [
          '[data-mqtitle="breakfast"]',
          '[data-title="breakfast"]'
        ],
        lunch: [
          '[data-mqtitle="lunch"]',
          '[data-title="lunch"]'
        ],
        dinner: [
          '[data-mqtitle="dinner"]',
          '[data-title="dinner"]'
        ]
      };

      for (const selector of selectors[name] || []) {
        const element = row.querySelector(selector);

        if (element) {
          return cleanText(element.innerText || element.textContent);
        }
      }

      const cells = row.querySelectorAll("td");

      if (cells[fallbackIndex]) {
        return cleanText(
          cells[fallbackIndex].innerText ||
          cells[fallbackIndex].textContent
        );
      }

      return "";
    }

    function parseDateFromRow(row) {
      const cells = row.querySelectorAll("td");

      if (cells.length === 0) {
        return null;
      }

      let dateText = "";

      const dateElement =
        row.querySelector('[data-mqtitle="date"]') ||
        row.querySelector('[data-title="date"]') ||
        cells[1];

      if (dateElement) {
        dateText = cleanText(
          dateElement.innerText || dateElement.textContent
        );
      }

      // 예: 10월 28일, 10.28, 2026-10-28
      let match = dateText.match(
        /(\d{4})\s*[.-]\s*(\d{1,2})\s*[.-]\s*(\d{1,2})/
      );

      if (match) {
        const date = new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        );

        if (!Number.isNaN(date.getTime())) {
          return date;
        }
      }

      match = dateText.match(
        /(\d{1,2})\s*월\s*(\d{1,2})\s*일/
      );

      if (match) {
        const month = Number(match[1]);
        const day = Number(match[2]);

        // 학교 페이지에 연도가 없을 때 주간 날짜의 연도를 사용
        let year = currentWeekMonday.getFullYear();

        // 주간 시작일과 종료일에 맞춰 연도 보정
        if (
          currentWeekMonday.getMonth() === 11 &&
          month === 1
        ) {
          year += 1;
        } else if (
          currentWeekMonday.getMonth() === 0 &&
          month === 12
        ) {
          year -= 1;
        }

        const date = new Date(year, month - 1, day);

        if (
          date.getMonth() === month - 1 &&
          date.getDate() === day
        ) {
          return date;
        }
      }

      match = dateText.match(
        /(\d{1,2})\s*[./-]\s*(\d{1,2})(?!\d)/
      );

      if (match) {
        const month = Number(match[1]);
        const day = Number(match[2]);

        let year = currentWeekMonday.getFullYear();

        if (
          currentWeekMonday.getMonth() === 11 &&
          month === 1
        ) {
          year += 1;
        } else if (
          currentWeekMonday.getMonth() === 0 &&
          month === 12
        ) {
          year -= 1;
        }

        const date = new Date(year, month - 1, day);

        if (
          date.getMonth() === month - 1 &&
          date.getDate() === day
        ) {
          return date;
        }
      }

      // 날짜 셀을 찾지 못한 경우 첫 번째 셀에서 요일을 확인
      const firstCell = cleanText(
        cells[0].innerText || cells[0].textContent
      );

      const dayMatch = firstCell.match(
        /(월|화|수|목|금)\s*요일?/
      );

      if (dayMatch) {
        const dayIndex = ["월", "화", "수", "목", "금"]
          .indexOf(dayMatch[1]);

        if (dayIndex >= 0) {
          return addDays(currentWeekMonday, dayIndex);
        }
      }

      return null;
    }

    function parseMealsFromHtml(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      const result = {};

      // 표 구조가 조금씩 달라질 수 있으므로 여러 선택자를 확인
      const rows = Array.from(
        doc.querySelectorAll(
          "table.food tbody tr, #food-info tbody tr, table tbody tr"
        )
      );

      for (const row of rows) {
        const date = parseDateFromRow(row);

        if (!date) {
          continue;
        }

        const monday = currentWeekMonday;
        const friday = getWeekEnd();

        // 현재 조회 중인 주의 평일만 반영
        if (date < monday || date > friday) {
          continue;
        }

        const dateKey = formatFullDate(date);

        result[dateKey] = {
          breakfast: findMealCell(row, "breakfast", 2),
          lunch: findMealCell(row, "lunch", 3),
          dinner: findMealCell(row, "dinner", 4)
        };
      }

      // 표 선택자가 일치하지 않을 때 날짜 정보가 포함된 행을 추가 탐색
      if (Object.keys(result).length === 0) {
        const allRows = Array.from(doc.querySelectorAll("tr"));

        for (const row of allRows) {
          const date = parseDateFromRow(row);

          if (!date) {
            continue;
          }

          if (
            date < currentWeekMonday ||
            date > getWeekEnd()
          ) {
            continue;
          }

          const cells = row.querySelectorAll("td");

          if (cells.length < 4) {
            continue;
          }

          result[formatFullDate(date)] = {
            breakfast: cleanText(
              cells[2].innerText || cells[2].textContent
            ),
            lunch: cleanText(
              cells[3].innerText || cells[3].textContent
            ),
            dinner: cleanText(
              cells[4]
                ? cells[4].innerText || cells[4].textContent
                : ""
            )
          };
        }
      }

      return result;
    }


    // ============================================
    // 식단 가져오기
    // ============================================

    async function fetchMeals(forceRefresh = false) {
      if (isLoading) {
        return;
      }

      if (!forceRefresh && loadMealsFromCache()) {
        return;
      }

      isLoading = true;

      const container = document.getElementById("mealContainer");
      const refreshButton = document.getElementById("refreshBtn");

      container.classList.add("loading");
      refreshButton.disabled = true;
      refreshButton.textContent = "불러오는 중...";

      setStatus("학교 홈페이지에서 식단을 가져오는 중입니다.");

      try {
        const weekStart = formatApiDate(currentWeekMonday);
        const weekEnd = formatApiDate(getWeekEnd());

        const requestUrl = new URL(WORKER_URL);

        requestUrl.searchParams.set("weekStart", weekStart);
        requestUrl.searchParams.set("weekEnd", weekEnd);

        // 강제 새로고침 시 브라우저 캐시도 우회
        if (forceRefresh) {
          requestUrl.searchParams.set(
            "_refresh",
            String(Date.now())
          );
        }

        const response = await fetch(requestUrl.toString(), {
          method: "GET",
          cache: "no-store"
        });

        const responseText = await response.text();

        if (!response.ok) {
          let errorMessage = `요청 실패: HTTP ${response.status}`;

          try {
            const errorData = JSON.parse(responseText);

            if (errorData.error) {
              errorMessage = errorData.error;
            }
          } catch (_) {
            // 응답이 JSON이 아니면 기본 오류 메시지를 사용
          }

          throw new Error(errorMessage);
        }

        if (
          /"error"\s*:/.test(responseText.slice(0, 500)) &&
          responseText.trim().startsWith("{")
        ) {
          try {
            const errorData = JSON.parse(responseText);
            throw new Error(
              errorData.error || "워커 요청에 실패했습니다."
            );
          } catch (error) {
            if (error instanceof Error && error.message) {
              throw error;
            }
          }
        }

        const parsedMeals = parseMealsFromHtml(responseText);

        if (Object.keys(parsedMeals).length === 0) {
          throw new Error(
            "식단 데이터를 찾지 못했습니다. 학교 홈페이지의 표 구조나 날짜 형식을 확인해야 합니다."
          );
        }

        mealsByDate = parsedMeals;

        saveMealsToCache();
        renderSelectedDay();

        setStatus(
          `식단을 업데이트했습니다. (${Object.keys(parsedMeals).length}일)`
        );
      } catch (error) {
        console.error("식단 가져오기 실패:", error);

        // 요청 실패 시 캐시가 있다면 기존 식단 유지
        const cachedSuccessfully = loadMealsFromCache();

        if (cachedSuccessfully) {
          setStatus(
            `최신 식단을 가져오지 못했습니다. 저장된 식단을 표시합니다. (${error.message})`
          );
        } else {
          mealsByDate = {};

          showMealText("breakfast", "식단을 불러오지 못했습니다.");
          showMealText("lunch", "식단을 불러오지 못했습니다.");
          showMealText("dinner", "식단을 불러오지 못했습니다.");

          setStatus(`오류: ${error.message}`);
        }
      } finally {
        isLoading = false;

        container.classList.remove("loading");
        refreshButton.disabled = false;
        refreshButton.textContent = "식단 새로고침";
      }
    }


    // ============================================
    // 주간 이동
    // ============================================

    function moveWeek(amount) {
      currentWeekMonday = addDays(
        currentWeekMonday,
        amount * 7
      );

      selectedDayIndex = 0;

      mealsByDate = {};

      updateDateControls();

      // 이동한 주에 해당하는 캐시를 사용하거나 새로 요청
      fetchMeals(false);
    }

    function goToCurrentWeek() {
      currentWeekMonday = getMonday(new Date());
      selectedDayIndex = getWeekdayIndex(new Date());

      mealsByDate = {};

      updateDateControls();

      fetchMeals(false);
    }


    // ============================================
    // 요일 이동
    // ============================================

    function moveDay(amount) {
      const nextDate = addDays(getSelectedDate(), amount);

      // 토요일·일요일은 표시하지 않고 인접 주의 평일로 이동
      if (nextDate.getDay() === 6) {
        currentWeekMonday = addDays(currentWeekMonday, 7);
        selectedDayIndex = 0;
      } else if (nextDate.getDay() === 0) {
        currentWeekMonday = addDays(currentWeekMonday, -7);
        selectedDayIndex = 4;
      } else {
        selectedDayIndex = getWeekdayIndex(nextDate);
      }

      mealsByDate = {};

      updateDateControls();

      fetchMeals(false);
    }


    // ============================================
    // 버튼 이벤트
    // ============================================

    document
      .getElementById("prevWeekBtn")
      .addEventListener("click", () => {
        moveWeek(-1);
      });

    document
      .getElementById("nextWeekBtn")
      .addEventListener("click", () => {
        moveWeek(1);
      });

    document
      .getElementById("currentWeekBtn")
      .addEventListener("click", () => {
        goToCurrentWeek();
      });

    document
      .getElementById("prevBtn")
      .addEventListener("click", () => {
        moveDay(-1);
      });

    document
      .getElementById("nextBtn")
      .addEventListener("click", () => {
        moveDay(1);
      });

    document
      .querySelectorAll(".day-button")
      .forEach((button) => {
        button.addEventListener("click", () => {
          selectedDayIndex = Number(button.dataset.day);

          renderSelectedDay();

          // 해당 날짜의 데이터가 없으면 그 주 식단을 요청
          const key = formatFullDate(getSelectedDate());

          if (!mealsByDate[key]) {
            fetchMeals(false);
          }
        });
      });

    document
      .getElementById("refreshBtn")
      .addEventListener("click", () => {
        fetchMeals(true);
      });


    // ============================================
    // 최초 실행
    // ============================================

    updateDateControls();

    // 먼저 캐시를 표시하고, 캐시가 없으면 서버에서 가져오기
    if (!loadMealsFromCache()) {
      fetchMeals(true);
    }
  </script>
</body>
</html>
