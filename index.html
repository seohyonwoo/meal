<script>
(() => {
  'use strict';

  // Cloudflare Worker 주소
  const WORKER_URL = 'https://meal.curly-base-322e.workers.dev/';

  // 041301=은행사/홍익사/해오름집
  // 041302=비전/블룸하우스
  // 041303=드림하우스
  // 041304=천안
  // 041305=예산
  const SOURCE_CODE = '041304';
  const SOURCE_URL = `https://dormi.kongju.ac.kr/HOME/sub.php?code=${SOURCE_CODE}`;

  document.getElementById('sourceLink').href = SOURCE_URL;

  // 월~금만 사용
  const DAY_NAMES = ['월', '화', '수', '목', '금'];
  const DAY_TO_INDEX = {
    '월': 0,
    '화': 1,
    '수': 2,
    '목': 3,
    '금': 4
  };

  const mealKeys = ['breakfast', 'lunch', 'dinner'];

  const mealElements = {
    breakfast: 'menuBreakfast',
    lunch: 'menuLunch',
    dinner: 'menuDinner'
  };

  const tagElements = {
    breakfast: 'tagBreakfast',
    lunch: 'tagLunch',
    dinner: 'tagDinner'
  };

  let weekly = emptyWeek();

  // 월요일=0, 화요일=1, ..., 일요일=6
  const weekdayTodayIdx = mondayIndex(new Date());

  // 토요일이나 일요일에는 금요일을 기본 선택
  let selectedDayIdx = Math.min(weekdayTodayIdx, 4);

  // 주말에는 오늘 표시를 하지 않음
  const todayIdx = weekdayTodayIdx < 5 ? weekdayTodayIdx : -1;

  let dates = Array(5).fill('');

  function emptyWeek() {
    return {
      breakfast: Array(5).fill(''),
      lunch: Array(5).fill(''),
      dinner: Array(5).fill('')
    };
  }

  function mondayIndex(date) {
    return (date.getDay() + 6) % 7;
  }

  function setStatus(message, state) {
    document.getElementById('statusText').textContent = message;

    const dot = document.getElementById('statusDot');

    dot.className = 'inline-block h-2.5 w-2.5 shrink-0 rounded-full';

    if (state === 'loading') {
      dot.classList.add('bg-blue-500', 'animate-ping');
    } else if (state === 'success') {
      dot.classList.add('bg-emerald-500');
    } else {
      dot.classList.add('bg-rose-500');
    }
  }

  function showError(message) {
    const box = document.getElementById('errorBox');
    box.textContent = message;
    box.classList.remove('hidden');
  }

  function clearError() {
    document.getElementById('errorBox').classList.add('hidden');
  }

  // 요일 탭 렌더링
  function renderTabs() {
    const holder = document.getElementById('dayTabs');
    holder.replaceChildren();

    DAY_NAMES.forEach((day, idx) => {
      const btn = document.createElement('button');
      const selected = idx === selectedDayIdx;

      btn.className =
        'relative flex flex-col items-center justify-center rounded-lg py-2 transition ' +
        (
          selected
            ? 'bg-indigo-600 text-white shadow-md'
            : 'bg-slate-50 text-slate-600 hover:bg-slate-100 dark:bg-slate-700/50 dark:text-slate-300 dark:hover:bg-slate-600'
        );

      const dayLabel = document.createElement('span');
      dayLabel.className = 'text-[10px] opacity-70';
      dayLabel.textContent = day;

      const dateLabel = document.createElement('span');
      dateLabel.className = 'text-xs font-bold';

      // 날짜를 10월 28일이 아니라 10/28 형식으로 표시
      if (dates[idx]) {
        const match = dates[idx].match(/(\d+)월\s*(\d+)일/);
        dateLabel.textContent = match
          ? `${Number(match[1])}/${Number(match[2])}`
          : day;
      } else {
        dateLabel.textContent = day + '요일';
      }

      btn.append(dayLabel, dateLabel);

      // 오늘 표시
      if (idx === todayIdx) {
        const marker = document.createElement('span');
        marker.className = 'absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-amber-400';
        btn.appendChild(marker);
      }

      btn.addEventListener('click', () => {
        selectedDayIdx = idx;
        renderTabs();
        displayMenus();
      });

      holder.appendChild(btn);
    });

    const nonEmptyDate = dates.find(Boolean);

    document.getElementById('weekLabel').textContent =
      nonEmptyDate
        ? '원본 식단표 기준 주간 메뉴'
        : '요일을 선택해 식단을 확인하세요';
  }

  // 현재 시간대 식사 강조
  function updateTags() {
    const hour = new Date().getHours();

    for (const key of mealKeys) {
      const tag = document.getElementById(tagElements[key]);

      tag.textContent = '식단';
      tag.className =
        'rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500 dark:bg-slate-700 dark:text-slate-400';
    }

    if (selectedDayIdx !== todayIdx) return;

    let active = null;

    if (hour >= 5 && hour < 10) {
      active = 'breakfast';
    } else if (hour >= 10 && hour < 15) {
      active = 'lunch';
    } else if (hour >= 15 && hour < 21) {
      active = 'dinner';
    }

    if (active) {
      const tag = document.getElementById(tagElements[active]);

      tag.textContent = '오늘 식사 시간대';
      tag.className =
        'rounded-full bg-indigo-100 px-2 py-0.5 text-xs font-bold text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200';
    }
  }

  // 식단 항목 출력
  function renderMeal(raw) {
    const container = document.createElement('div');

    const lines = String(raw || '')
      .replace(/\r/g, '')
      .split('\n')
      .map(s => s.replace(/\u00a0/g, ' ').trim())
      .filter(Boolean);

    if (!lines.length) {
      const p = document.createElement('p');
      p.className = 'italic text-slate-400';
      p.textContent = '등록된 식단이 없습니다.';
      container.appendChild(p);
      return container;
    }

    for (const line of lines) {
      const item = document.createElement('div');
      item.className = 'meal-line py-0.5';

      if (/kcal/i.test(line)) {
        item.className =
          'meal-line mt-2 text-xs font-semibold text-indigo-500 dark:text-indigo-400';

        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-fire mr-1';

        item.append(icon, document.createTextNode(line));
      } else {
        item.textContent = '• ' + line;
      }

      container.appendChild(item);
    }

    return container;
  }

  function displayMenus() {
    updateTags();

    for (const key of mealKeys) {
      document
        .getElementById(mealElements[key])
        .replaceChildren(renderMeal(weekly[key][selectedDayIdx]));
    }
  }

  // 원본 식단표 HTML 파싱
  function parseSource(htmlText) {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');

    const rows = [
      ...doc.querySelectorAll(
        'table.food tbody tr, #food-info tbody tr, tbody tr'
      )
    ];

    if (!rows.length) {
      const title = doc.title || '';

      if (/cloudflare|error|access denied|요청이 차단/i.test(htmlText.slice(0, 5000))) {
        throw new Error('Worker가 식단표 대신 차단/오류 페이지를 반환했습니다.');
      }

      throw new Error(
        `식단표 표(tbody tr)를 찾지 못했습니다. 응답 제목: ${title || '(제목 없음)'}. Worker가 원본 HTML을 반환하는지 확인해 주세요.`
      );
    }

    const next = emptyWeek();
    const nextDates = Array(5).fill('');
    let foundMealRows = 0;

    for (const row of rows) {
      const dayCell =
        row.querySelector('[data-mqtitle="day"]') ||
        row.querySelector('td:first-child');

      if (!dayCell) continue;

      const dayText = (dayCell.textContent || '').replace(/\s+/g, '');
      const match = dayText.match(/[월화수목금토일]/);

      if (!match) continue;

      const idx = DAY_TO_INDEX[match[0]];

      // 토요일과 일요일은 완전히 건너뜀
      if (idx === undefined) continue;

      const dateCell =
        row.querySelector('[data-mqtitle="date"]') ||
        row.querySelector('td:nth-child(2)');

      if (dateCell) {
        nextDates[idx] = (dateCell.textContent || '').trim();
      }

      const cells = {
        breakfast:
          row.querySelector('[data-mqtitle="breakfast"]') ||
          row.querySelector('td:nth-child(3)'),

        lunch:
          row.querySelector('[data-mqtitle="lunch"]') ||
          row.querySelector('td:nth-child(4)'),

        dinner:
          row.querySelector('[data-mqtitle="dinner"]') ||
          row.querySelector('td:nth-child(5)')
      };

      for (const key of mealKeys) {
        if (!cells[key]) continue;

        const html = cells[key].innerHTML
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/(?:p|div|li)\s*>/gi, '\n');

        const temp = document.createElement('div');
        temp.innerHTML = html;

        next[key][idx] = (temp.textContent || '')
          .replace(/\u00a0/g, ' ')
          .trim();
      }

      foundMealRows++;
    }

    if (!foundMealRows) {
      throw new Error('요일 행은 있지만 식단 데이터를 읽지 못했습니다.');
    }

    const hasAnyMeal = mealKeys.some(key =>
      next[key].some(value => value.trim())
    );

    if (!hasAnyMeal) {
      throw new Error(
        '요일 표는 찾았지만 모든 끼니가 비어 있습니다. Worker가 올바른 캠퍼스 페이지를 가져오는지 확인해 주세요.'
      );
    }

    return {
      data: next,
      dates: nextDates
    };
  }

  // 이번 주 월요일 날짜를 기준으로 캐시 키 생성
  function getWeekCacheKey() {
    const now = new Date();

    const monday = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    monday.setDate(monday.getDate() - mondayIndex(monday));

    const yyyy = monday.getFullYear();
    const mm = String(monday.getMonth() + 1).padStart(2, '0');
    const dd = String(monday.getDate()).padStart(2, '0');

    return `kongju-dorm-meals:${SOURCE_CODE}:${yyyy}-${mm}-${dd}`;
  }

  // 식단을 브라우저에 저장
  function saveMealsToCache(data, dateList) {
    try {
      localStorage.setItem(
        getWeekCacheKey(),
        JSON.stringify({
          savedAt: Date.now(),
          data,
          dates: dateList
        })
      );
    } catch (error) {
      console.warn('[식단표] 브라우저 캐시에 저장하지 못했습니다.', error);
    }
  }

  // 저장된 식단 불러오기
  function loadMealsFromCache() {
    try {
      const raw = localStorage.getItem(getWeekCacheKey());

      if (!raw) return false;

      const cached = JSON.parse(raw);

      if (!cached || !cached.data || !Array.isArray(cached.dates)) {
        return false;
      }

      if (!mealKeys.every(key =>
        Array.isArray(cached.data[key]) &&
        cached.data[key].length === 5
      )) {
        return false;
      }

      if (!mealKeys.some(key =>
        cached.data[key].some(value => String(value || '').trim())
      )) {
        return false;
      }

      weekly = cached.data;
      dates = cached.dates;

      selectedDayIdx = dateIndexForToday(dates) ?? Math.min(todayIdx < 0 ? 4 : todayIdx, 4);

      renderTabs();
      displayMenus();

      const savedTime = cached.savedAt
        ? new Date(cached.savedAt).toLocaleString('ko-KR', {
            month: 'numeric',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          })
        : '';

      setStatus(
        `저장된 이번 주 식단 표시 중${savedTime ? ` · ${savedTime} 저장` : ''}`,
        'success'
      );

      return true;

    } catch (error) {
      console.warn('[식단표] 캐시를 읽지 못했습니다.', error);
      return false;
    }
  }

  // 식단 데이터 불러오기
  async function fetchMeals(forceRefresh = false) {
    const retry = document.getElementById('retryBtn');

    // 저장된 캐시가 있으면 네트워크 요청 없이 표시
    if (!forceRefresh && loadMealsFromCache()) {
      clearError();
      return;
    }

    retry.disabled = true;
    retry.textContent = '불러오는 중...';

    clearError();

    setStatus(
      forceRefresh
        ? '최신 식단을 다시 불러오는 중...'
        : '식단 데이터를 처음 불러오는 중...',
      'loading'
    );

    try {
      const response = await fetch(WORKER_URL, {
        method: 'GET',
        cache: 'no-store',
        headers: {
          'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8'
        }
      });

      if (!response.ok) {
        throw new Error(`Worker HTTP 오류 (${response.status})`);
      }

      const contentType = response.headers.get('content-type') || '';
      const body = await response.text();

      if (!body.trim()) {
        throw new Error('Worker 응답이 비어 있습니다.');
      }

      let htmlText = body;
      let parsed;

      // Worker가 JSON을 반환하는 경우도 지원
      if (contentType.includes('application/json') || /^\s*\{/.test(body)) {
        let json;

        try {
          json = JSON.parse(body);
        } catch (_) {
          throw new Error('Worker가 JSON이라고 표시했지만 JSON 형식이 올바르지 않습니다.');
        }

        htmlText = json.html || json.data || json.body || '';

        if (!htmlText && Array.isArray(json.rows)) {
          const mapped = emptyWeek();
          const mappedDates = Array(5).fill('');

          json.rows.forEach(item => {
            const day = String(item.day || item.weekday || '')
              .replace(/\s/g, '')
              .match(/[월화수목금토일]/)?.[0];

            // 토·일 데이터는 저장하지 않음
            if (!day || DAY_TO_INDEX[day] === undefined) return;

            const i = DAY_TO_INDEX[day];

            mappedDates[i] = item.date || '';
            mapped.breakfast[i] = item.breakfast || '';
            mapped.lunch[i] = item.lunch || '';
            mapped.dinner[i] = item.dinner || '';
          });

          if (!mealKeys.some(key => mapped[key].some(Boolean))) {
            throw new Error('Worker JSON 응답에 식단 데이터가 없습니다.');
          }

          parsed = {
            data: mapped,
            dates: mappedDates
          };
        }

        if (!htmlText && !parsed) {
          throw new Error(
            json.error ||
            'JSON 응답에서 html/data/body 또는 rows 필드를 찾지 못했습니다.'
          );
        }
      }

      if (!parsed) {
        parsed = parseSource(htmlText);
      }

      weekly = parsed.data;
      dates = parsed.dates;

      selectedDayIdx =
        dateIndexForToday(dates) ??
        Math.min(todayIdx < 0 ? 4 : todayIdx, 4);

      renderTabs();
      displayMenus();

      // 성공한 식단을 이번 주 캐시에 저장
      saveMealsToCache(weekly, dates);

      setStatus('식단 연동 성공 · 이번 주 식단 저장 완료', 'success');

    } catch (error) {
      console.error('[식단표]', error);

      setStatus('식단을 새로 불러오지 못했습니다.', 'error');

      showError(
        `${error.message} 기존에 저장된 식단이 있다면 화면에는 유지됩니다. 잠시 후 새로고침을 다시 시도하거나 원본 식단표를 확인해 주세요.`
      );

    } finally {
      retry.disabled = false;
      retry.textContent = '새로고침';
    }
  }

  // 오늘 날짜에 해당하는 요일 인덱스 찾기
  function dateIndexForToday(dateStrings) {
    const now = new Date();

    const today =
      `${now.getMonth() + 1}월 ${now.getDate()}일`
        .replace(/\s/g, '');

    const idx = dateStrings.findIndex(s =>
      String(s).replace(/\s/g, '').includes(today)
    );

    return idx >= 0 ? idx : null;
  }

  // 이전 요일: 월요일에서 더 이전으로 넘어가면 금요일
  document.getElementById('prevBtn').addEventListener('click', () => {
    selectedDayIdx = (selectedDayIdx + 4) % 5;
    renderTabs();
    displayMenus();
  });

  // 다음 요일: 금요일 다음은 월요일
  document.getElementById('nextBtn').addEventListener('click', () => {
    selectedDayIdx = (selectedDayIdx + 1) % 5;
    renderTabs();
    displayMenus();
  });

  // 오늘 버튼
  document.getElementById('todayBtn').addEventListener('click', () => {
    selectedDayIdx =
      dateIndexForToday(dates) ??
      Math.min(todayIdx < 0 ? 4 : todayIdx, 4);

    renderTabs();
    displayMenus();
  });

  // 수동 새로고침은 캐시를 무시하고 Worker에서 다시 가져옴
  document.getElementById('retryBtn').addEventListener('click', () => {
    fetchMeals(true);
  });

  // 다크 모드 전환
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');

    try {
      localStorage.setItem(
        'meal-theme',
        document.documentElement.classList.contains('dark') ? 'dark' : 'light'
      );
    } catch (_) {}
  });

  // 저장된 테마 적용
  try {
    if (localStorage.getItem('meal-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  } catch (_) {}

  // 최초 실행
  renderTabs();
  fetchMeals(false);

})();
</script>

</body>
</html>
